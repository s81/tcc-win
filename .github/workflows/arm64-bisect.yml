# TEMPORARY: narrow down why the arm64-win32 compiler built on ARM64
# Windows treats defined structs as incomplete (introduced by edb87a2).
# To be removed after diagnosis.
name: arm64 diagnose (temporary)

on:
  pull_request:

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        variant: [msvc-O2-trace, msvc-O2-symattr16]
    name: arm64 struct test, tcc built by ${{ matrix.variant }}
    runs-on: windows-11-arm
    timeout-minutes: 10
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
    - uses: actions/checkout@v4
    - name: struct test program
      shell: bash
      run: |
        printf 'struct S { int a, b; };\nint main(void)\n{\n    struct T { struct S s; int c; } t = { { 1, 2 }, 3 };\n    return sizeof(struct S) == 8 && sizeof t == 12 && t.s.b == 2 ? 0 : 1;\n}\n' > win32/t.c
    - name: build tcc and compile the struct program
      shell: cmd
      run: |
        cd win32
        for /f "delims=" %%i in ('vswhere.exe -latest -property installationPath') do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" arm64
        if "%VARIANT%"=="msvc-O2-trace" set _CL_=/DTCCW_DEBUG_STRUCT
        if "%VARIANT%"=="msvc-O2-symattr16" set _CL_=/DTCCW_SYMATTR16X2
        set COMPILER=cl
        if "%VARIANT%"=="clang" set COMPILER=clang
        call build-tcc.bat -c %COMPILER% -t arm64 >build.log 2>&1
        findstr /c:"error" /c:"warning" build.log
        tcc.exe -B. t.c -o t.exe 2>&1
        tcc.exe -B. t.c -o t.exe >nul 2>&1 || exit /b 1
        t.exe || exit /b 1
        echo STRUCT_OK
