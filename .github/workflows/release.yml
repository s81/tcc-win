name: release

# Publishes tcc-win for the three Windows targets as a GitHub Release.
#
# Two ways to start a release:
# - Actions -> release -> "Run workflow" on main, with a version such as
#   v0.1.0: the workflow creates the tag itself, then builds and publishes.
# - Push a tag 'vX.Y.Z'.
#
# The packaged compilers are tested (compile, link and run) before anything
# is published. Pull requests that change the packaging run the same build
# and tests, and upload the zips as workflow artifacts, but publish nothing.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.1.0 (the tag is created on the selected branch, which must be main)'
        required: true
        type: string
  pull_request:
    paths:
    - .github/workflows/release.yml
    - win32/build-tcc.bat

permissions:
  contents: read

jobs:
  # work out the tag and version; nothing is changed here
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
    - uses: actions/checkout@v4
    - id: v
      name: tag and version
      env:
        EVENT: ${{ github.event_name }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        case "$EVENT" in
          workflow_dispatch)
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "releases are made from main, not $GITHUB_REF"; exit 1
            fi
            tag=$INPUT_VERSION ;;
          push) tag=$GITHUB_REF_NAME ;;
          *) tag= ;;
        esac
        if [ -n "$tag" ]; then
          # the tag is used in cmd and file names: allow only safe characters
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9][0-9A-Za-z.+-]*$'; then
            echo "invalid version '$tag' (expected e.g. v0.1.0)"; exit 1
          fi
          version=${tag#v}
        else
          version="$(cat VERSION)-dev"
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "tag: '$tag', version: '$version'"

  # 'Run workflow' only: create the tag on the commit being released.
  # A tag pushed with GITHUB_TOKEN does not start another workflow run.
  tag:
    needs: prepare
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: create and push the tag
      env:
        TAG: ${{ needs.prepare.outputs.tag }}
        VERSION: ${{ needs.prepare.outputs.version }}
      run: |
        if git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null; then
          echo "tag $TAG already exists"; exit 1
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -a "$TAG" -m "tcc-win $VERSION" "$GITHUB_SHA"
        git push origin "refs/tags/$TAG"

  package:
    needs: [ prepare, tag ]
    # 'tag' is skipped except for 'Run workflow'
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64
            vcarch: amd64
            os: windows-2025
          - target: i386
            vcarch: x86
            os: windows-2025
          - target: arm64
            vcarch: arm64
            os: windows-11-arm
    name: package (${{ matrix.target }}-win32)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      T: ${{ matrix.target }}
      V: ${{ needs.prepare.outputs.version }}
    steps:
    - uses: actions/checkout@v4
      with:
        # build from the tag, so that 'tcc -v' names it (empty: default ref)
        ref: ${{ needs.prepare.outputs.tag && format('refs/tags/{0}', needs.prepare.outputs.tag) || '' }}
    - name: build and install (MSVC)
      shell: cmd
      run: |
        cd win32
        for /f "delims=" %%i in ('vswhere.exe -latest -property installationPath') do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcarch }}
        call build-tcc.bat -c cl -t %T% -v %V% -i ..\dist\tcc-win
        if errorlevel 1 exit /b 1
    - name: add documentation
      shell: bash
      run: |
        cp README.md COPYING dist/tcc-win/
        cp docs/OWNERSHIP.md dist/tcc-win/doc/
    - name: test the installed compiler (compile, link and run)
      shell: bash
      run: |
        dist/tcc-win/tcc.exe -v
        TCC="$PWD/dist/tcc-win/tcc.exe" RUN=1 sh tests/tccwin-tests.sh
    - name: zip
      shell: pwsh
      run: Compress-Archive -Path dist/tcc-win -DestinationPath "tcc-win-$env:V-$env:T-win32.zip"
    - uses: actions/upload-artifact@v4
      with:
        name: tcc-win-${{ env.V }}-${{ matrix.target }}-win32
        path: tcc-win-${{ env.V }}-${{ matrix.target }}-win32.zip
        if-no-files-found: error

  publish:
    needs: [ prepare, package ]
    if: always() && needs.package.result == 'success' && needs.prepare.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    - name: checksums
      run: cd dist && sha256sum *.zip > SHA256SUMS && cat SHA256SUMS
    - name: create the release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        gh release create "$TAG" dist/*.zip dist/SHA256SUMS \
          --repo "$GITHUB_REPOSITORY" --title "tcc-win $TAG" \
          --generate-notes --verify-tag
