name: release

# Pushing a tag 'vX.Y.Z' builds tcc-win for the three Windows targets,
# tests the packaged compilers and publishes them as a GitHub Release.
# Pull requests that change the packaging run the same build and tests,
# and upload the zips as workflow artifacts, but publish nothing.

on:
  push:
    tags: [ 'v*' ]
  pull_request:
    paths:
    - .github/workflows/release.yml
    - win32/build-tcc.bat

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64
            vcarch: amd64
            os: windows-2025
          - target: i386
            vcarch: x86
            os: windows-2025
          - target: arm64
            vcarch: arm64
            os: windows-11-arm
    name: package (${{ matrix.target }}-win32)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      T: ${{ matrix.target }}
    steps:
    - uses: actions/checkout@v4
    - name: version
      shell: bash
      run: |
        case "$GITHUB_REF" in
          refs/tags/v*) v=${GITHUB_REF#refs/tags/v} ;;
          *) v="$(cat VERSION)-dev" ;;
        esac
        # the version is used in cmd and file names: allow only safe characters
        if ! printf '%s' "$v" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z.+-]*$'; then
          echo "invalid version '$v'"; exit 1
        fi
        echo "V=$v" >> "$GITHUB_ENV"
        echo "version: $v"
    - name: build and install (MSVC)
      shell: cmd
      run: |
        cd win32
        for /f "delims=" %%i in ('vswhere.exe -latest -property installationPath') do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcarch }}
        call build-tcc.bat -c cl -t %T% -v %V% -i ..\dist\tcc-win
        if errorlevel 1 exit /b 1
    - name: add documentation
      shell: bash
      run: |
        cp README.md COPYING dist/tcc-win/
        cp docs/OWNERSHIP.md dist/tcc-win/doc/
    - name: test the installed compiler (compile, link and run)
      shell: bash
      run: |
        dist/tcc-win/tcc.exe -v
        TCC="$PWD/dist/tcc-win/tcc.exe" RUN=1 sh tests/tccwin-tests.sh
    - name: zip
      shell: pwsh
      run: Compress-Archive -Path dist/tcc-win -DestinationPath "tcc-win-$env:V-$env:T-win32.zip"
    - uses: actions/upload-artifact@v4
      with:
        name: tcc-win-${{ env.V }}-${{ matrix.target }}-win32
        path: tcc-win-${{ env.V }}-${{ matrix.target }}-win32.zip
        if-no-files-found: error

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    - name: checksums
      run: cd dist && sha256sum *.zip > SHA256SUMS && cat SHA256SUMS
    - name: create the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS \
          --repo "$GITHUB_REPOSITORY" --title "tcc-win $GITHUB_REF_NAME" \
          --generate-notes --verify-tag
