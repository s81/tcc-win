name: build and test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  cross-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - name: build Windows cross compilers
      run: ./configure && make cross-x86_64-win32 cross-i386-win32 cross-arm64-win32
    - name: C23 + ownership tests (compile and link)
      run: tests/tccwin-tests.sh
    - name: upstream test suite (host build)
      run: make && make test -k

  x86_64-win32:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: build (x86_64-win32)
      shell: cmd
      run: |
        cd win32
        for /f "delims=" %%i in ('vswhere.exe -latest -property installationPath') do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" amd64
        call build-tcc.bat -c cl -t x86_64
    - name: C23 + ownership tests (compile, link and run)
      shell: bash
      run: TCC="$PWD/win32/tcc.exe" RUN=1 sh tests/tccwin-tests.sh
    - name: upstream test suite (gcc as reference compiler)
      shell: cmd
      run: |
        cd tests
        call test-win32.bat all -k

  i386-win32:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: build (i386-win32)
      shell: cmd
      run: |
        cd win32
        for /f "delims=" %%i in ('vswhere.exe -latest -property installationPath') do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" x86
        call build-tcc.bat -c cl -t i386
    - name: C23 + ownership tests (compile, link and run)
      shell: bash
      run: TCC="$PWD/win32/tcc.exe" RUN=1 sh tests/tccwin-tests.sh
    - name: upstream test suite (32-bit gcc as reference compiler)
      shell: cmd
      run: |
        cd tests
        call test-win32.bat -p c:\mingw32\bin all -k

  arm64-win32:
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: build (arm64-win32)
      shell: cmd
      run: |
        cd win32
        for /f "delims=" %%i in ('vswhere.exe -latest -property installationPath') do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" arm64
        call build-tcc.bat -c cl -t arm64
    - name: C23 + ownership tests (compile, link and run)
      shell: bash
      run: TCC="$PWD/win32/tcc.exe" RUN=1 sh tests/tccwin-tests.sh
    - name: upstream test suite (clang as reference compiler)
      shell: cmd
      run: |
        cd tests
        call test-win32.bat -c clang all -k

  # tcc-win must be able to compile itself: stage 1 is built with MSVC,
  # stage 2 with stage 1, stage 3 with stage 2. Stages 2 and 3 are built
  # by the same compiler code, so their binaries must be byte-identical.
  self-host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            vcarch: amd64
          - target: i386
            vcarch: x86
    name: self-host (${{ matrix.target }}-win32)
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      T: ${{ matrix.target }}
    steps:
    - uses: actions/checkout@v4
    - name: stage 1 (built by MSVC)
      shell: cmd
      run: |
        cd win32
        for /f "delims=" %%i in ('vswhere.exe -latest -property installationPath') do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcarch }}
        call build-tcc.bat -c cl -t %T%
        if errorlevel 1 exit /b 1
        xcopy /s /i /q /y . "%RUNNER_TEMP%\stage1" >nul || exit /b 1
    - name: stage 2 (built by stage 1)
      shell: cmd
      run: |
        cd win32
        call build-tcc.bat -clean >nul
        call build-tcc.bat -c "%RUNNER_TEMP%\stage1\tcc.exe" -t %T%
        if errorlevel 1 exit /b 1
        xcopy /s /i /q /y . "%RUNNER_TEMP%\stage2" >nul || exit /b 1
    - name: stage 3 (built by stage 2)
      shell: cmd
      run: |
        cd win32
        call build-tcc.bat -clean >nul
        call build-tcc.bat -c "%RUNNER_TEMP%\stage2\tcc.exe" -t %T%
        if errorlevel 1 exit /b 1
    - name: stage 2 and stage 3 are identical
      shell: cmd
      run: |
        cd win32
        for %%f in (tcc.exe libtcc.dll lib\libtcc1.a) do (
          fc /b %%f "%RUNNER_TEMP%\stage2\%%f" >nul || (echo %%f differs between stage 2 and stage 3 & exit /b 1)
          echo %%f: stage 2 == stage 3
        )
    - name: C23 + ownership tests with the stage 3 compiler (compile, link and run)
      shell: bash
      run: TCC="$PWD/win32/tcc.exe" RUN=1 sh tests/tccwin-tests.sh
